<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Tone.js (global `Tone`) for the preview, loaded before the modules that use it -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
    <script type="module" src="../../DO_NOT_TOUCH/js/form.js"></script>
    <script type="module" src="../../DO_NOT_TOUCH/js/generateJson.js"></script>
    <script type="module" src="../../DO_NOT_TOUCH/js/loadJson.js"></script>
    <script type="module" src="../../DO_NOT_TOUCH/js/preview.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="jsonform.css">
    <title>Score Generator</title>
</head>
<body>
    <h1>JSON Form</h1>

    <!-- REUPLOAD JSON FILE / EDIT PROJECT -->
    <section id="loadJsonSection">
        <label for="jsonFile">Load an existing project</label>
        <p class="description">Upload a previously generated project (.ZIP) to make edits</p>
        <input type="file" id="jsonFile" accept=".zip,.json,application/json,application/zip">
        <p id="loadJsonStatus" role="status"></p>
    </section>

    <!-- JSON FORM -->
    <form id="jsonForm">
        <!-- Project Name -->
        <label>Name</label>
        <p class="description">What is the title of your project</p>
        <input type="text" id="projectName" placeholder="My project name" required>

        <br><br>
        
        <!-- Audio section -->
        <h4>Audio</h4>
        <label>Add audio files</label>
        <br>
        <section id="audio_section">
            <div id="row" class="row" >
                <div id="column">
                    <label>Upload Audio file</label>
                    <input type="file" class="audioFileInput" accept="audio/*">
                </div>
                <button class="removeAudio deleteButton" title="Delete" aria-label="Delete" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="45" height="44" viewBox="0 0 45 44" fill="none">
                        <path d="M13.125 38.5C12.0938 38.5 11.2109 38.141 10.4766 37.4229C9.74219 36.7049 9.375 35.8417 9.375 34.8333L9.375 11H7.5L7.5 7.33333L16.875 7.33333V5.5L28.125 5.5V7.33333L37.5 7.33333V11H35.625V34.8333C35.625 35.8417 35.2578 36.7049 34.5234 37.4229C33.7891 38.141 32.9062 38.5 31.875 38.5L13.125 38.5ZM16.875 31.1667L20.625 31.1667L20.625 14.6667H16.875L16.875 31.1667ZM24.375 31.1667H28.125L28.125 14.6667H24.375L24.375 31.1667Z" fill="#03010100"></path>
                    </svg>
                </button>
            </div>

        </section>
        
        <br>
        <button id="addAudio" type="button">+ Add Audio</button>


        <!-- Groupe slection -->
        <br><br>
        <h3>Grouping</h3>
        <label>How many groups are needed ?</label>
        <br>
        <select id="groupSelection">
            <option value="0" selected="selected" disabled hidden>Choose here</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        

        <br><br>

        <section id="groupeSection">

        </section>

        <!-- Preview: plays the groups ticked "Include in preview", with their current effects and events -->
        <section id="previewSection">
            <h3>Preview</h3>
            <p class="description">Hear the ticked groups as they are now. Press Play again after making changes.</p>
            <label for="previewStart">Start from</label>
            <input type="text" id="previewStart" placeholder="0:00" inputmode="decimal">
            <button type="button" id="previewPlay">Play preview</button>
            <button type="button" id="previewStop" disabled>Stop</button>
            <span id="previewTime">0:00</span>
            <p id="previewStatus" role="status"></p>
            <ul id="previewWarnings"></ul>
        </section>

       <button type="submit" id="generateJson"> Generate JSON File</button>



    </form>
</body>
</html>
