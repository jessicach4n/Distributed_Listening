<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="../../DO_NOT_TOUCH/js/pages/conductor.js"></script>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="conductor.css">
    <title>Conductor</title>
</head>
<body>
    <div id="loading-screen" class="is-connecting" role="status" aria-live="polite">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p id="connection">Connecting to the server…</p>
    </div>

    <div id="conductor-content" class="conductor-content">
        <h1>Distributed Listening Conductor View</h1>
        <section>
            <div class="section-header">
                <h2>Team distribution</h2>
                <h3 id="phone-info">0 phones joined the room.</h3>
            </div>
            <div class="player-qr">
                <div id="player-qr-code" role="img" aria-label="QR code linking to the player page"></div>
                <h3>Join with a phone</h3>
                <a href="../player/player.html">Go to Player Page</a>
            </div>
        </section>
        <section class="pieces-content">
            <button id="refresh-btn" disabled>Refresh</button>
            <div class="pieces-carousel">
                <button id="pieces-previous" class="piece-scroll-button" type="button" aria-label="Scroll to previous pieces" hidden>
                    <img src="../icons/arrow-right.svg" alt="">
                </button>
                <div id="pieces-list" class="pieces-list" aria-live="polite">
                    <p>Loading pieces…</p>
                </div>
                <button id="pieces-next" class="piece-scroll-button" type="button" aria-label="Scroll to next pieces" hidden>
                    <img src="../icons/arrow-right.svg" alt="">
                </button>
            </div>
            <p id="error"></p>
        </section>
        <section>
            <p id="piece-info">No piece loaded.</p>
            <ul id="group-list"></ul>
            <div>
                <button id="deselect-btn" type="button" disabled>Deselect all</button>
                <button id="play-btn" disabled>Play</button>
                <button id="stop-btn" disabled>Stop</button>
            </div>
        </section>
    </div>
</body>
</html>
