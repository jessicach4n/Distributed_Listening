<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../../DO_NOT_TOUCH/js/conductor.js"></script>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="conductor.css">
    <title>Conductor</title>
</head>
<body>
    <h1>Conductor</h1>
    <p id="connection">Connecting…</p>

    <section>
        <label for="piece-select">Piece (folder in performances)</label>
        <div>
            <select id="piece-select" disabled>
                <option>Loading pieces…</option>
            </select>
            <button id="refresh-btn" disabled>Refresh</button>
            <button id="load-btn" disabled>Load</button>
        </div>
        <p id="error"></p>
    </section>

    <section>
        <p id="piece-info">No piece loaded.</p>
        <p id="phone-info">0 phones joined.</p>
        <ul id="group-list"></ul>
        <div>
            <button id="play-btn" disabled>Play</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
    </section>
</body>
</html>
